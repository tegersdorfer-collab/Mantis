name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          # Regeln/Excludes stehen in ruff.toml (F = echte Bugs, E9 = Syntax).
          ruff check .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # Schlankes, in einem frischen venv validiertes Set: die Tests mocken DB/
          # Netz/LLM, und die schweren Voice-/ML-Pakete (piper/whisper/onnx) werden
          # lazy geladen — ihre Tests skippen sich per importorskip, wenn sie fehlen.
          pip install -r requirements-test.txt

      - name: Tests
        run: pytest -q --disable-warnings

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: node --test tests/test_spicetify_bridge.mjs
