<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c12">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<title>Mantis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ── Design Tokens ──────────────────────────────────── */
:root{
  --bg:#09090f; --s1:#111118; --s2:#17171f; --s3:#1e1e28;
  --bd:#252535; --ac:#6366f1; --aa:rgba(99,102,241,.1); --ab:rgba(99,102,241,.18);
  --tx:#e8e8f4; --t1:#c8c8e0; --t2:#7070a0; --t3:#383858; --green:#22c55e; --red:#f43f5e;
  --purple:#a78bfa; --y:#f59e0b; --ya:rgba(245,158,11,.1); --line:#252535;
  --accent:#6366f1; --radius:12px; --radius-s:8px; --radius-xs:6px;
  --shadow:0 2px 12px rgba(0,0,0,.35);
  --mono:'JetBrains Mono',monospace;
  --head:'Inter',sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f0f0f6; --s1:#ffffff; --s2:#f5f5fb; --s3:#ebebf5;
  --bd:#dcdcec; --ac:#6366f1; --aa:rgba(99,102,241,.07); --ab:rgba(99,102,241,.13);
  --tx:#111128; --t1:#2a2a48; --t2:#505078; --t3:#a0a0c0; --green:#16a34a; --red:#dc2626;
  --purple:#7c3aed; --y:#d97706; --ya:rgba(217,119,6,.08); --line:#dcdcec;
  --accent:#6366f1;
  --shadow:0 2px 12px rgba(0,0,0,.08);
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:var(--body);overscroll-behavior:none;min-height:100vh;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}

/* ── Base Components ─────────────────────────────────── */
.c{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);}
.c2{background:var(--s2);border:1px solid var(--bd);border-radius:var(--radius-s);}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);}
.soft{background:var(--s2);border:none;border-radius:var(--radius-s);}

/* Buttons */
.btn{
  height:32px;padding:0 16px;
  background:var(--ac);
  color:#fff;border:none;border-radius:7px;
  font-weight:600;font-size:12px;
  cursor:pointer;transition:.15s;white-space:nowrap;flex-shrink:0;
  font-family:var(--body);
}
.btn:hover{background:#4f52d4;transform:translateY(-1px);}
.btn:active{opacity:.85;transform:none;}

.btn-g{
  background:transparent;border:1px solid var(--bd);
  color:var(--t2);height:32px;padding:0 14px;border-radius:7px;
  font-size:12px;cursor:pointer;transition:.15s;
  font-family:var(--body);
}
.btn-g:hover{border-color:var(--ac);color:var(--ac);}
.btn-g:active{opacity:.8;}
.btn-ghost{background:var(--s2);color:var(--t2);border:none;cursor:pointer;border-radius:7px;}
.btn-danger{
  background:var(--red);
  color:#fff;height:32px;padding:0 14px;border:none;border-radius:7px;
  font-size:12px;font-weight:600;cursor:pointer;
}
.icon-btn{
  width:32px;height:32px;border-radius:7px;
  background:var(--s2);border:1px solid var(--bd);
  color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;transition:.15s;
}
.icon-btn:hover{border-color:var(--ac);color:var(--ac);}

/* Chip / Badge */
.chip{
  display:inline-flex;align-items:center;
  background:var(--aa);border:1px solid rgba(99,102,241,.25);
  border-radius:5px;padding:2px 8px;font-size:11px;
  color:var(--ac);font-family:var(--mono);
}
.chip-g{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--green);}
.chip-r{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.25);color:var(--red);}
.chip-n{background:var(--s2);border:1px solid var(--bd);color:var(--t2);}

/* Inputs */
input,textarea,select{
  background:var(--s2);border:1px solid var(--bd);border-radius:8px;
  color:var(--tx);padding:9px 12px;font-size:14px;width:100%;
  outline:none;font-family:var(--body);transition:.15s;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--ac);
  box-shadow:0 0 0 3px rgba(99,102,241,.12);
}
label.field-label{display:block;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--t3);margin-bottom:6px;font-weight:600;}

/* Divider */
.sep{border:none;border-top:1px solid var(--bd);margin:0;}

/* Pills / Progress */
.pill-h{height:4px;border-radius:2px;background:var(--s3);overflow:hidden;}
.pill-f{height:100%;background:var(--ac);border-radius:2px;transition:width .5s;}

/* Stat */
.mono{font-family:var(--mono);}
.stat-val{font-family:var(--mono);font-weight:700;font-size:24px;line-height:1;color:var(--tx);letter-spacing:-.5px;}
.stat-lbl{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--t2);margin-top:4px;font-weight:500;}

/* Section header */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--t2);}

/* Ring */
.jring{transform:rotate(-90deg);box-shadow:none!important;}

/* Markdown */
.md-result h1,.md-result h2,.md-result h3{color:var(--tx);font-weight:700;margin:12px 0 5px;}
.md-result h1{font-size:15px;}.md-result h2{font-size:14px;}.md-result h3{font-size:13px;}
.md-result p{margin:5px 0;line-height:1.6;}
.md-result ul,.md-result ol{padding-left:16px;margin:5px 0;}
.md-result li{margin:2px 0;}
.md-result code{background:var(--s2);border-radius:4px;padding:1px 5px;font-size:12px;color:var(--ac);font-family:var(--mono);border:1px solid var(--bd);}
.md-result pre{background:var(--s2);border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0;border:1px solid var(--bd);}
.md-result hr{border:none;border-top:1px solid var(--bd);margin:10px 0;}
.md-result strong{color:var(--tx);}

/* Chat messages */
.msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;}
.msg-u{background:var(--ac);color:#fff;font-weight:500;border-bottom-right-radius:3px;margin-left:auto;}
.msg-a{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-bottom-left-radius:3px;}

/* Animations */
.fade{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Pulse dot */
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

/* Status bar */
.status-bar{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-radius:8px;background:var(--s1);border:1px solid var(--bd);
  font-size:12px;color:var(--t2);transition:.3s;
}
.status-bar.thinking,.status-bar.tool,.status-bar.task_working,.status-bar.learning{
  border-color:rgba(99,102,241,.3);background:rgba(99,102,241,.05);
}
.status-bar.memory{border-color:rgba(34,197,94,.25);}
.status-bar.error{border-color:rgba(244,63,94,.3);}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--t3);transition:.3s;}
.sdot.thinking,.sdot.tool,.sdot.learning,.sdot.task_working{background:var(--ac);animation:pulse-dot 1.2s infinite;}
.sdot.memory,.sdot.idle{background:var(--green);}
.sdot.error{background:var(--red);}
.act-row{display:flex;gap:8px;padding:6px 0;font-size:12px;color:var(--t2);border-bottom:1px solid var(--bd);animation:fadein .2s;}
.act-row:last-child{border-bottom:none;}

/* Heat cell */
.heat{width:10px;height:10px;border-radius:2px;background:var(--s3);}

/* Tabs */
.tabbar{display:flex;gap:2px;margin-bottom:16px;background:var(--s2);border-radius:10px;padding:3px;border:1px solid var(--bd);}
.tab{flex:1;text-align:center;padding:7px 4px;border-radius:8px;color:var(--t2);font-size:11px;cursor:pointer;font-weight:600;transition:.2s;letter-spacing:.2px;}
.tab.active{background:var(--s1);color:var(--tx);border:1px solid var(--bd);box-shadow:0 1px 6px rgba(0,0,0,.25);}

/* ── Layout ──────────────────────────────────────────── */
.shell{display:flex;min-height:100vh;width:100%;}
.sbar{display:none;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}

/* Header */
.hdr{
  position:sticky;top:0;z-index:40;
  background:rgba(9,9,15,.88);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(37,37,53,.8);
  padding:0 18px;padding-top:env(safe-area-inset-top);
  height:calc(52px + env(safe-area-inset-top));
}
.hdr-inner{height:52px;display:flex;align-items:center;justify-content:space-between;}

/* Content area */
.cnt{padding:16px 16px calc(80px + env(safe-area-inset-bottom));}

/* Bottom nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(9,9,15,.92);backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid rgba(37,37,53,.7);
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-inner{display:flex;justify-content:space-around;align-items:center;height:60px;max-width:640px;margin:0 auto;}
.nb{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;cursor:pointer;padding:8px 10px;
  color:var(--t3);font-size:9px;letter-spacing:.4px;transition:.2s;
  min-width:52px;font-family:var(--body);text-transform:uppercase;font-weight:600;
}
.nb .ico{font-size:22px;line-height:1;transition:.2s;}
.nb.active{color:var(--ac);}
.nb.active .ico{transform:scale(1.1);filter:drop-shadow(0 0 6px rgba(99,102,241,.5));}

/* Modal sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none;}
.sheet.open{display:block;}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);}
.sheet-card{
  position:absolute;bottom:0;left:0;right:0;max-width:580px;margin:0 auto;
  border-radius:20px 20px 0 0;
  background:var(--s1);
  border-top:1px solid var(--bd);
  border-left:1px solid var(--bd);
  border-right:1px solid var(--bd);
  padding:12px 18px calc(20px + env(safe-area-inset-bottom));
  animation:sup .24s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto;
}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.sheet-handle{width:32px;height:3px;background:var(--bd);border-radius:2px;margin:0 auto 16px;}

/* Task row */
.task-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);}
.task-row:last-child{border-bottom:none;}
.task-cb{
  width:18px;height:18px;border-radius:5px;
  border:1.5px solid var(--bd);background:none;
  cursor:pointer;flex-shrink:0;margin-top:2px;transition:.15s;
}
.task-cb:hover{border-color:var(--green);}

/* Metric tile */
.mtile{
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);
  padding:16px 14px;display:flex;flex-direction:column;gap:3px;
  transition:.2s;box-shadow:var(--shadow);
}
.mtile:hover{border-color:rgba(99,102,241,.4);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.4);}

/* Desktop overrides */
@media(min-width:900px){
  .sbar{
    display:flex;flex-direction:column;width:210px;flex-shrink:0;
    border-right:1px solid var(--bd);padding:14px 10px;
    position:sticky;top:0;height:100vh;gap:1px;overflow-y:auto;
    background:var(--s1);
  }
  .sb-logo{display:flex;align-items:center;gap:11px;padding:10px 10px 20px;}
  .sb-btn{
    display:flex;align-items:center;gap:9px;padding:8px 12px;
    border-radius:var(--radius-s);color:var(--t2);background:none;border:none;
    font-size:13px;cursor:pointer;text-align:left;width:100%;
    transition:.15s;font-family:var(--body);font-weight:500;
  }
  .sb-btn:hover{background:var(--s2);color:var(--tx);}
  .sb-btn.active{background:var(--aa);color:var(--ac);font-weight:600;}
  .bnav{display:none;}
  .hdr{display:none;}
  .cnt{padding:24px 32px 48px;max-width:none;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
  .chat-wrap{max-width:none;}
  .sheet-card{
    max-width:520px;border-radius:var(--radius);
    bottom:auto;top:50%;left:50%;right:auto;
    transform:translate(-50%,-50%);
    border:1px solid var(--bd);
  }
  @keyframes sup{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
}
</style>
</head>
<body>
<div class="shell">

<!-- ── Desktop Sidebar ──────────────────────────────── -->
<aside class="sbar">
  <div class="sb-logo">
    <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--aa);border:1px solid var(--bd)">🤖</div>
    <div>
      <div style="font-weight:700;font-size:14px;color:var(--tx);letter-spacing:-.2px">Mantis</div>
      <div id="sideStatus" style="font-size:11px;color:var(--t3)">–</div>
    </div>
  </div>
  <div id="sideNav"></div>
</aside>

<!-- ── Main ─────────────────────────────────────────── -->
<div class="main">

  <!-- Header -->
  <header class="hdr" id="topHeader">
    <div class="hdr-inner">
      <div style="display:flex;align-items:center;gap:11px">
        <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--aa);border:1px solid rgba(99,102,241,.25);flex-shrink:0;font-size:15px">🤖</div>
        <div>
          <div style="font-weight:700;font-size:15px;color:var(--tx);letter-spacing:-.4px;line-height:1.2" id="hello">Mantis</div>
          <div style="font-size:10px;color:var(--t2);font-weight:500;letter-spacing:.2px" id="sub">Verbinde…</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="clock" style="font-size:12px;color:var(--t2);font-family:var(--mono);font-weight:500;letter-spacing:.5px"></span>
        <span id="dot" style="width:7px;height:7px;border-radius:50%;background:var(--t3);display:inline-block;transition:.4s;flex-shrink:0"></span>
      </div>
    </div>
  </header>

  <!-- View content -->
  <div class="cnt" id="view"></div>

</div><!-- end .main -->
</div><!-- end .shell -->

<!-- ── Bottom Nav (mobile) ──────────────────────────── -->
<nav class="bnav">
  <div class="bnav-inner">
    <button class="nb" data-v="home"><div class="ico"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 10L11 3L19 10V19H14V14H8V19H3V10Z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg></div>HOME</button>
    <button class="nb" data-v="chat"><div class="ico"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 4h14v11H4z" stroke="currentColor" stroke-width="1.4" fill="none" rx="2"/><path d="M8 18l3-3h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="10" r="1" fill="currentColor"/><circle cx="11" cy="10" r="1" fill="currentColor"/><circle cx="14" cy="10" r="1" fill="currentColor"/></svg></div>CHAT</button>
    <button class="nb" data-v="body"><div class="ico"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 19C11 19 3 14 3 8.5A5 5 0 0 1 11 5.5 5 5 0 0 1 19 8.5C19 14 11 19 11 19Z" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 9h2l1.5 3 1.5-5 1.5 3H16" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>HEALTH</button>
    <button class="nb" data-v="habits"><div class="ico"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="13" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="13" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M14 16l2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>HABITS</button>
    <button class="nb" data-v="more"><div class="ico"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="5" cy="11" r="1.5" fill="currentColor"/><circle cx="11" cy="11" r="1.5" fill="currentColor"/><circle cx="17" cy="11" r="1.5" fill="currentColor"/></svg></div>MORE</button>
  </div>
</nav>

<!-- ── Sheet ─────────────────────────────────────────── -->
<div class="sheet" id="sheet">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-card" id="sheetCard"></div>
</div>

<script>
const API=location.origin; let CUR='home'; let charts={};
const NAV=[['home','⌂','Home'],['chat','◎','Chat'],['body','♡','Health'],['habits','▣','Habits'],
  ['tasks','◻','Tasks'],['calendar','⊟','Kalender'],['nutrition','⊕','Ernährung'],
  ['journal','▤','Journal'],['goals','◈','Ziele'],['brain','⬡','Brain'],
  ['memory','◈','Memory'],['mind','◬','A.I. Mind'],['analytics','⌇','Analytics'],
  ['globe','🌍','Globus'],['map','🗺','Karte'],['settings','⚙','Settings']];

const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const view=()=>$('#view');
function showLogin(message='Bitte Dashboard-Token eingeben.') {
  let login=document.getElementById('authLogin');
  if(!login){
    login=document.createElement('div');login.id='authLogin';
    login.style.cssText='position:fixed;inset:0;z-index:99999;background:#0a0f1e;display:grid;place-items:center';
    login.innerHTML='<form style="width:min(360px,90vw)"><h2>Mantis anmelden</h2><p id="authMessage"></p><input name="token" type="password" autocomplete="current-password" placeholder="Dashboard-Token" required><button type="submit">Anmelden</button></form>';
    login.querySelector('form').onsubmit=async e=>{
      e.preventDefault();const input=login.querySelector('input');
      try{const r=await fetch('/auth/session',{method:'POST',headers:{Authorization:'Bearer '+input.value}});input.value='';
        if(r.ok){location.reload();return;}showLogin(r.status===503?'DASHBOARD_TOKEN muss auf dem Server gesetzt werden.':'Token ungültig.');
      }catch(e){showLogin('Server nicht erreichbar.');}
    };
    document.body.appendChild(login);
  }
  document.getElementById('authMessage').textContent=message;
}
async function api(p,o){const r=await fetch(API+p,o);if(r.status===401||r.status===503){showLogin(r.status===503?'Server nicht bereit. DASHBOARD_TOKEN prüfen.':undefined);throw new Error('Authentication required');}if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function post(p,b){return api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});}
async function del(p){return api(p,{method:'DELETE'});}
async function put(p,b){return api(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});}
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code style="background:var(--s2);padding:1px 5px;border-radius:5px">$1</code>');}
function toast(t){const x=el(`<div style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--bd);color:var(--tx);padding:9px 16px;border-radius:6px;z-index:90;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.5);white-space:nowrap">${esc(t)}</div>`);document.body.appendChild(x);setTimeout(()=>x.remove(),1900);}

function ring(pct,size=60,stroke=6,color='var(--y)'){const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(1,pct||0));return `<svg width="${size}" height="${size}" class="jring"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--s3)" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;}

};
function modelBadge(m){return MODEL_BADGES[m]||'';}
let _activeModel='';
let _actLog=[]; // letzten N Status-Events für Activity-Feed
let _actSeen=new Set(); // Dedup: bereits gesehene Event-Timestamps

function applyStatus(evt){
  if(evt.keepalive) return;
  const type=evt.type||'idle';
  const text=evt.text||'';
  const detail=evt.detail||'';

  // Modell aus detail extrahieren und merken
  if(detail && MODEL_BADGES[detail]) _activeModel=detail;

  const badge=_activeModel?modelBadge(_activeModel):'';
  const fullText=`${STATUS_ICONS[type]||'·'} ${text}${detail&&!MODEL_BADGES[detail]?' · '+detail:''}`;

  // Dot in Header
  const dot=$('#dot');
  if(dot){
    dot.style.background=type==='idle'?'var(--green)':type==='error'?'var(--red)':'var(--ac)';
    dot.style.boxShadow=type==='idle'?'0 0 8px rgba(0,229,160,.6)':type==='error'?'0 0 8px rgba(255,51,102,.5)':'0 0 8px rgba(0,200,255,.6)';
  }

  // Sub-Zeile Header
  const sub=$('#sub');
  if(sub&&type!=='idle') sub.innerHTML=fullText+badge;

  // Sidebar
  const ss=$('#sideStatus');
  if(ss&&type!=='idle') ss.textContent=`${STATUS_ICONS[type]||'·'} ${text}`;

  // Home-Status-Bar
  const bar=$('#homeStatus');
  if(bar){
    bar.className=`status-bar ${type}`;
    const sdot=bar.querySelector('.sdot');
    if(sdot) sdot.className=`sdot ${type}`;
    const stxt=bar.querySelector('.stxt');
    if(stxt) stxt.innerHTML=fullText+badge;
  }

  // Activity-Log Buffer – mit Dedup über Timestamp
  if(type!=='idle'){
    const ts=evt.ts||Date.now()/1000;
    // Schlüssel: ts + type + text (gleicher Event kann in verschiedenen Sekunden kommen)
    const key=`${Math.round(ts*10)}|${type}|${text}`;
    if(!_actSeen.has(key)){
      _actSeen.add(key);
      // Set begrenzen damit er nicht unbegrenzt wächst
      if(_actSeen.size>200){
        const oldest=[..._actSeen].slice(0,50);
        oldest.forEach(k=>_actSeen.delete(k));
      }
      _actLog.unshift({...evt, ts});
      if(_actLog.length>50) _actLog=_actLog.slice(0,50);
      // Live-Feed in Mind-View einblenden falls offen
      const feed=$('#actFeed');
      if(feed){
        const row=el(`<div class="act-row"><span style="color:var(--ac)">${STATUS_ICONS[type]||'·'}</span><span style="flex:1;color:var(--tx)">${esc(text)}${detail?` <span style="color:var(--t2)">${esc(detail)}</span>`:''}</span><span style="color:var(--t3);font-family:var(--mono);font-size:10px">${new Date(ts*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div>`);
        feed.prepend(row);
        while(feed.children.length>60) feed.lastChild.remove();
      }
    }
  }
}

function startStatusStream(){
  const es=new EventSource(`${API}/api/status/stream`);
  es.onmessage=ev=>{try{applyStatus(JSON.parse(ev.data));}catch(e){}};
  es.onerror=()=>setTimeout(startStatusStream, 5000); // reconnect
}

const VIEWS={};
function go(v){
  if(v==='more'){openMore();return;}
  const prev=view().firstChild;if(prev&&prev._cleanup)prev._cleanup();
  CUR=v;
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  view().innerHTML='';
  const root=el('<div class="fade"></div>');
  view().appendChild(root);
  (VIEWS[v]||(()=>{}))(root);
}

function toggleTheme(){

function ringStat(p,icon,val,col){return `<div style="position:relative">${ring(p,66,7,col)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"><span style="font-size:14px">${icon}</span><span style="font-size:12px;font-weight:600;font-family:var(--mono)">${val}</span></div></div>`;}

VIEWS.chat=async(root)=>{
  root.innerHTML=`<div class="chat-wrap" style="display:flex;flex-direction:column;height:calc(100vh - 120px)">
    <div id="cmsgs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 0 12px"></div>
    <div style="display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--bd)">
      <textarea id="cin" rows="1" placeholder="Nachricht…" style="flex:1;resize:none;max-height:120px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;font-size:14px;color:var(--tx);font-family:inherit;outline:none" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
      <button class="btn-g" id="micBtn" onclick="toggleVoiceInput()" style="height:38px;width:38px;align-self:flex-end;font-size:16px">🎤</button>
      <button class="btn" onclick="sendChat()" style="height:38px;padding:0 16px;align-self:flex-end">↑</button>
    </div>
    <div style="font-size:10px;color:var(--t3);margin-top:5px;text-align:center">Enter zum Senden · Shift+Enter für Zeilenumbruch</div>
  </div>`;
  const box=$('#cmsgs');
  const hist=await api('/api/chat/history?limit=40');
  hist.forEach(m=>box.appendChild(chatBubble(m.role,m.content)));
  box.scrollTop=box.scrollHeight;
  const ta=$('#cin');ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';});
};
function chatBubble(role,content){return el(`<div class="msg ${role==='user'?'msg-u':'msg-a'}">${md(content)}</div>`);}

let _recog=null;
function toggleVoiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$('#micBtn');
  if(!SR){toast('Spracheingabe wird von diesem Browser nicht unterstützt');return;}
  if(_recog){_recog.stop();return;}
  _recog=new SR();
  _recog.lang='de-DE';_recog.interimResults=true;_recog.continuous=false;
  const ta=$('#cin');
  const base=ta.value;
  btn.style.color='var(--red)';btn.textContent='⏹';
  _recog.onresult=(e)=>{
    let txt='';for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
    ta.value=(base?base+' ':'')+txt;
    ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';
  };
  _recog.onerror=()=>{toast('Spracheingabe-Fehler');};
  _recog.onend=()=>{btn.style.color='';btn.textContent='🎤';_recog=null;};
  _recog.start();
}
async function sendChat(){
  const inp=$('#cin');const text=inp.value.trim();if(!text)return;inp.value='';inp.style.height='auto';
  const box=$('#cmsgs');box.appendChild(chatBubble('user',text));
  const a=chatBubble('assistant','…');box.appendChild(a);box.scrollTop=box.scrollHeight;
  try{
    const es=new EventSource(`${API}/api/chat/stream?text=${encodeURIComponent(text)}`);
    es.onmessage=(ev)=>{const d=JSON.parse(ev.data);
      if(d.partial){a.innerHTML=md(d.partial);}
      if('done' in d){a.innerHTML=md(d.done);if(d.tools&&d.tools.length){a.appendChild(el(`<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${d.tools.map(t=>`<span class="chip">🔧 ${t}</span>`).join('')}</div>`));}es.close();}
      box.scrollTop=box.scrollHeight;};
    es.onerror=()=>es.close();
  }catch(e){a.innerHTML='Fehler.';}
}

VIEWS.habits=async(root)=>{
  const isMobile=window.innerWidth<640;
  const DAYS=isMobile?7:14;
  const CATS=[
    {key:'morning',label:'Morning',color:'#f5c400',bg:'rgba(245,196,0,0.08)'},
    {key:'day',    label:'Tag',    color:'#22c55e',bg:'rgba(34,197,94,0.07)'},
    {key:'evening',label:'Abend',  color:'#60a5fa',bg:'rgba(96,165,250,0.07)'},
  ];
  root.innerHTML=`<div class="sec-hdr"><span class="sec-title">Routinen</span><button class="btn" onclick="addHabit()" style="height:28px;font-size:11px;padding:0 10px">+ Neu</button></div><div id="hbody"></div>`;
  const [hs,cm]=await Promise.all([api('/api/habits'),api('/api/habits/commit?days='+DAYS)]);
  const body=$('#hbody');

  // Commit-Bar
  if(cm.length){
    const avg=Math.round(cm.reduce((a,b)=>a+b.pct,0)/cm.length);
    const barsHtml=cm.map(d=>`<div title="${d.date}: ${d.pct}%" style="flex:1;height:${Math.max(3,d.pct*0.36)}px;border-radius:2px 2px 0 0;align-self:flex-end;background:${d.pct>=100?'#22c55e':d.pct>=50?'#eab308':d.pct>0?'var(--s3)':'#1a1a1e'}"></div>`).join('');
    body.insertAdjacentHTML('beforeend',`<div class="c" style="padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px"><svg width="44" height="44" viewBox="0 0 44 44" style="flex-shrink:0"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--s3)" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="${avg>=80?'#22c55e':avg>=50?'#eab308':'#f59e0b'}" stroke-width="4" stroke-dasharray="${Math.round(avg*1.13)} 113" stroke-linecap="round" transform="rotate(-90 22 22)"/><text x="22" y="27" text-anchor="middle" font-size="10" fill="#e2e8f0" font-weight="bold">${avg}%</text></svg><div style="flex:1;display:flex;gap:2px;align-items:flex-end;height:36px">${barsHtml}</div></div>`);
  }

  if(!hs.length){body.insertAdjacentHTML('beforeend','<div class="c" style="padding:24px;text-align:center;color:var(--t3)">Noch keine Routinen – leg welche an!</div>');return;}

  // Datumsspalten
  const today=new Date();
  const dateCols=[];
  for(let i=DAYS;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);dateCols.push(d.toISOString().slice(0,10));}
  // Spalten: [Handle 18px] [Streak 32px] [Name ~140px] [14 past dots flex] [heute 38px] [X 28px]
  const COLS=isMobile?`16px 28px minmax(80px,1fr) repeat(${DAYS},1fr) 34px 24px`:`18px 32px minmax(100px,160px) repeat(${DAYS},1fr) 38px 28px`;

  // Eine gemeinsame Card für alle Kategorien
  const masterCard=document.createElement('div');
  masterCard.className='c';masterCard.style.cssText='padding:0;overflow:hidden';

  // Datums-Header (einmalig ganz oben)
  const hdrRow=document.createElement('div');
  hdrRow.style.cssText=`display:flex;align-items:center;border-bottom:1px solid var(--bd)`;
  // Platz für vertikales Label
  hdrRow.insertAdjacentHTML('beforeend','<div style="width:28px;flex-shrink:0"></div>');
  // Grid-Header
  const hdrGrid=document.createElement('div');
  hdrGrid.style.cssText=`flex:1;display:grid;grid-template-columns:${COLS};align-items:center;padding:0 6px 0 8px`;
  hdrGrid.insertAdjacentHTML('beforeend','<div></div>');
  hdrGrid.insertAdjacentHTML('beforeend','<div style="text-align:center;font-size:9px;color:#333;padding:5px 0">🔥</div>');
  hdrGrid.insertAdjacentHTML('beforeend','<div style="font-size:10px;color:#333;padding:5px 0 5px 4px">Routine</div>');
  for(let i=0;i<DAYS;i++){
    const dt=new Date(dateCols[i]);
    const lbl=['So','Mo','Di','Mi','Do','Fr','Sa'][dt.getDay()];
    const isMon=lbl==='Mo';
    hdrGrid.insertAdjacentHTML('beforeend',`<div style="text-align:center;font-size:9px;color:${isMon?'var(--t2)':'var(--t3)'};padding:5px 0;${isMon?'border-left:1px solid var(--bd)':''}">${isMon||lbl==='So'?lbl:''}</div>`);
  }
  hdrGrid.insertAdjacentHTML('beforeend',`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--t2);padding:5px 0">Heu</div>`);
  hdrGrid.insertAdjacentHTML('beforeend','<div></div>');
  hdrRow.appendChild(hdrGrid);
  masterCard.appendChild(hdrRow);

  CATS.forEach((cat,ci)=>{
    const inCat=hs.filter(h=>(h.category||'day')===cat.key);
    if(!inCat.length)return;
    const doneToday=inCat.filter(h=>h.today_done).length;

    // Trennlinie zwischen Sektionen
    if(ci>0) masterCard.insertAdjacentHTML('beforeend',`<div style="height:1px;background:var(--bd)"></div>`);

    // Sektion: vertikales Label links + Habit-Zeilen rechts
    const section=document.createElement('div');
    section.style.cssText='display:flex;align-items:stretch';

    // Vertikales Kategorie-Label
    const label=document.createElement('div');
    label.style.cssText=`width:28px;flex-shrink:0;background:${cat.color}18;display:flex;align-items:center;justify-content:center;border-right:2px solid ${cat.color};cursor:default`;
    const labelInner=document.createElement('div');
    labelInner.style.cssText=`writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;color:${cat.color};letter-spacing:.5px;padding:8px 0;user-select:none;display:flex;align-items:center;gap:4px`;
    labelInner.innerHTML=`<span>${cat.label.split(' ').slice(1).join(' ')}</span>`;
    // Chip mit done/total unten
    const chip=document.createElement('span');
    chip.style.cssText=`font-size:9px;opacity:.7;font-weight:400`;
    chip.textContent=`${doneToday}/${inCat.length}`;
    labelInner.appendChild(chip);
    label.appendChild(labelInner);
    section.appendChild(label);

    // Habit-Zeilen
    const rows=document.createElement('div');
    rows.style.cssText='flex:1;min-width:0';

    // Drag & Drop state für diese Sektion
    let dragSrc=null;
    function saveCatOrder(){
      const payload=[...rows.querySelectorAll('[data-hid]')].map((el,i)=>({id:+el.dataset.hid,sort_order:i}));
      api('/api/habits/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    }

    inCat.forEach((h,hi)=>{
      const row=document.createElement('div');
      row.dataset.hid=h.id;
      row.draggable=false; // nur per Handle aktivierbar
      row.style.cssText=`display:grid;grid-template-columns:${COLS};align-items:center;padding:0 6px 0 4px;border-top:1px solid var(--bd);background:${hi%2?'rgba(255,255,255,0.025)':'transparent'};transition:opacity .15s`;
      row.addEventListener('dragstart',e=>{if(!row.draggable)return e.preventDefault();dragSrc=row;e.dataTransfer.effectAllowed='move';setTimeout(()=>row.style.opacity='0.35',0);});
      row.addEventListener('dragend',()=>{row.draggable=false;row.style.opacity='1';saveCatOrder();});
      row.addEventListener('dragover',e=>{if(!dragSrc)return;e.preventDefault();if(dragSrc!==row){const mid=row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;rows.insertBefore(dragSrc,e.clientY<mid?row:row.nextSibling);}});

      // Drag Handle — setzt draggable nur bei Mousedown auf Handle
      const handle=document.createElement('div');
      handle.style.cssText='display:flex;align-items:center;justify-content:center;cursor:grab;color:var(--t3);font-size:14px;padding:0 2px;user-select:none;line-height:1';
      handle.innerHTML='<span style="letter-spacing:-1px">⠿</span>';
      handle.onmouseenter=()=>handle.style.color='#555';
      handle.onmouseleave=()=>handle.style.color='#2d3f5a';
      handle.addEventListener('mousedown',e=>{e.stopPropagation();row.draggable=true;});
      row.appendChild(handle);

      // Streak-Ring
      const s=h.streak||0;
      const pct=Math.min(s/Math.max(s,7),1);
      const streakDiv=document.createElement('div');
      streakDiv.style.cssText='display:flex;align-items:center;justify-content:center;padding:6px 0';
      streakDiv.innerHTML=`<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#1e1e28" stroke-width="3"/><circle cx="13" cy="13" r="10" fill="none" stroke="${s>=7?'#f5c400':s>=1?cat.color:'#2a2a35'}" stroke-width="3" stroke-dasharray="${Math.round(pct*62.8)} 62.8" stroke-linecap="round" transform="rotate(-90 13 13)"/>${s>0?`<text x="13" y="17" text-anchor="middle" font-size="8" fill="#e2e8f0" font-weight="bold">${s}</text>`:`<text x="13" y="17" text-anchor="middle" font-size="8" fill="#444">–</text>`}</svg>`;
      row.appendChild(streakDiv);

      // Name
      const nameDiv=document.createElement('div');
      nameDiv.style.cssText='display:flex;align-items:center;gap:6px;padding:6px 0 6px 4px;min-width:0';
      nameDiv.innerHTML=`<span style="font-size:15px;flex-shrink:0">${h.emoji}</span><span style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.name)}</span>`;
      row.appendChild(nameDiv);

      // Vergangene Dots (größer als vorher)
      for(let i=0;i<DAYS;i++){
        const done=h.done_dates?.includes(dateCols[i]);
        const dt=new Date(dateCols[i]);
        const isMon=['Mo'][0]===['So','Mo','Di','Mi','Do','Fr','Sa'][dt.getDay()];
        const dotDiv=document.createElement('div');
        dotDiv.style.cssText=`display:flex;align-items:center;justify-content:center;${isMon?'border-left:1px solid var(--bd)':''}`;
        dotDiv.innerHTML=`<div title="${dateCols[i]}" style="width:${done?14:7}px;height:${done?14:7}px;border-radius:${done?4:50}px;background:${done?cat.color:'#222228'};box-shadow:${done?'0 0 6px '+cat.color+'66':'none'}"></div>`;
        row.appendChild(dotDiv);
      }

      // Heute-Checkbox
      const todayDone=h.done_dates?.includes(dateCols[DAYS]);
      const cb=document.createElement('div');
      cb.style.cssText='display:flex;align-items:center;justify-content:center';
      const cbBtn=document.createElement('button');
      cbBtn.style.cssText=`width:26px;height:26px;border-radius:7px;border:2px solid ${todayDone?cat.color:'var(--bd)'};background:${todayDone?cat.color:'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;padding:0;transition:all .15s`;
      cbBtn.textContent=todayDone?'✓':'';
      let _done=todayDone;
      cbBtn.onclick=async(e)=>{
        e.stopPropagation();
        if(_done){
          await api('/api/habits/'+h.id+'/unlog',{method:'POST'});
          _done=false;
          cbBtn.textContent='';
          cbBtn.style.background='transparent';
          cbBtn.style.borderColor='var(--bd)';
          toast('Zurückgesetzt');
        } else {
          await api('/api/habits/'+h.id+'/log',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          _done=true;
          cbBtn.textContent='✓';
          cbBtn.style.background=cat.color;
          cbBtn.style.borderColor=cat.color;
          toast('🔥 Abgehakt');
        }
      };
      cb.appendChild(cbBtn);row.appendChild(cb);

      // X ganz rechts
      const delDiv=document.createElement('div');
      delDiv.style.cssText='display:flex;align-items:center;justify-content:center';
      const delBtn=document.createElement('button');
      delBtn.style.cssText='background:none;border:none;color:var(--t3);font-size:13px;cursor:pointer;padding:2px;border-radius:4px;line-height:1;transition:color .1s';
      delBtn.textContent='✕';
      delBtn.onmouseenter=()=>delBtn.style.color='#ef4444';
      delBtn.onmouseleave=()=>delBtn.style.color='var(--t3)';
      delBtn.onclick=(e)=>{e.stopPropagation();deleteHabit(h.id,h.name);};
      delDiv.appendChild(delBtn);row.appendChild(delDiv);

      rows.appendChild(row);
    });
    section.appendChild(rows);
    masterCard.appendChild(section);
  });
  body.appendChild(masterCard);
};

// ════════ TASKS (Arten, Unteraufgaben, Fortschritt, Archiv) ════════
let taskFilter='open';
VIEWS.tasks=async(root)=>{
  const [ts, suggestions] = await Promise.all([
    api('/api/tasks?status='+taskFilter),
    api('/api/tasks/suggestions'),
  ]);

  root.innerHTML=`
    <div class="sec-hdr">
      <span class="sec-title">Aufgaben</span>
      <div style="display:flex;gap:6px">
        <button id="genBtn" onclick="generateTask()" class="btn-g" style="height:28px;font-size:11px;padding:0 10px">⚡ Generieren</button>
        <button class="btn" onclick="addTask()" style="height:28px;font-size:11px;padding:0 10px">+ Neu</button>
      </div>
    </div>
    ${suggestions.length ? `
    <div style="margin-bottom:12px">
      <div style="font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--y);margin-bottom:6px">⚡ Mantis schlägt vor</div>
      <div id="sugg-list"></div>
    </div>` : ''}
    <div class="tabbar" style="display:flex;gap:2px;margin-bottom:10px">
      ${['open','mantis','done','archived'].map(f=>`<button onclick="setTaskFilter('${f}')" style="flex:1;height:32px;border:none;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.4px;cursor:pointer;transition:.15s;background:${taskFilter===f?'var(--y)':'var(--s3)'};color:${taskFilter===f?'#000':'var(--t3)'};box-shadow:${taskFilter===f?'0 0 10px rgba(245,196,0,.25)':'none'}">${{open:'Offen',mantis:'⚡ Mantis',done:'Erledigt',archived:'Archiv'}[f]}</button>`).join('')}
    </div>
    <div id="tl"></div>`;

  // Suggestions rendern
  if(suggestions.length){
    const sl=$('#sugg-list');
    suggestions.forEach(s=>{
      const who=s.assigned_to==='mantis'?'<span style="font-size:10px;background:var(--ya);color:var(--y);padding:2px 7px;border-radius:99px;margin-left:6px">Mantis erledigt</span>':'';
      const node=el(`<div class="c" style="padding:12px;margin-bottom:8px;border-color:rgba(245,196,0,.2)">
        <div style="font-size:13px;font-weight:600;margin-bottom:4px">${esc(s.title)}${who}</div>
        ${s.notes?`<div style="font-size:11px;color:var(--t2);margin-bottom:8px">${esc(s.notes)}</div>`:''}
        <div style="display:flex;gap:6px">
          <button onclick="acceptSuggestion(${s.id})" class="btn" style="flex:1;height:28px;font-size:11px">✓ Annehmen</button>
          <button onclick="rejectSuggestion(${s.id},'${esc(s.title)}')" class="btn-g" style="flex:1;height:28px;font-size:11px">✕ Ablehnen</button>
        </div>
      </div>`);
      sl.appendChild(node);
    });
  }

  // Tasks rendern
  const kindIcon={task:'',project:'📁 ',checklist:'☑️ '};
  let filtered=ts;
  if(taskFilter==='mantis') filtered=ts.filter(t=>t.assigned_to==='mantis');
  // "Offen" zeigt alle offenen Tasks — Mantis-Tasks mit blauem Rand erkennbar

  if(!filtered.length){
    $('#tl').innerHTML='<div style="padding:20px 0;text-align:center;font-size:13px;color:var(--t3)">'+(taskFilter==='mantis'?'Keine Mantis-Aufgaben':'Nichts hier')+'</div>';
    return;
  }
  filtered.forEach(t=>{
    const subs=t.subtasks||[];
    const isMantis=t.assigned_to==='mantis';
    const mantisChip=isMantis?`<span style="font-size:10px;background:var(--ya);color:var(--y);padding:2px 7px;border-radius:99px">🤖</span>`:'';
    const node=el(`<div class="c" style="padding:12px 14px;margin-bottom:8px${isMantis?';border-left:2px solid var(--y)':''}">
      <div style="display:flex;align-items:center;gap:11px">
        ${taskFilter==='open'?`<button onclick="completeTask(${t.id})" class="task-cb"></button>`:''}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600">${kindIcon[t.kind]||''}${esc(t.title)}${mantisChip}</div>
          ${subs.length?`<div style="font-size:11px;color:var(--t2);margin-top:3px">${subs.filter(s=>s.status==='done').length}/${subs.length} erledigt · ${t.progress_pct}%</div><div style="margin-top:5px;background:var(--s3);border-radius:2px;overflow:hidden"><div style="width:${t.progress_pct}%;background:var(--y)"></div></div>`:''}

        </div>
        <span>${({high:'<span class="chip-r" style="font-size:9px;padding:2px 7px;font-family:var(--mono)">HIGH</span>',medium:'<span class="chip" style="font-size:9px;padding:2px 7px;font-family:var(--mono)">MED</span>',low:'<span style="font-size:9px;padding:2px 7px;border-radius:4px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:var(--green);font-family:var(--mono)">LOW</span>'})[t.priority]||''}</span>
        <button onclick="taskMenu(${t.id},'${esc(t.title)}','${taskFilter}')" class="btn-g" style="border:none;border-radius:10px;padding:6px 9px;cursor:pointer">⋯</button>
      </div>
      ${subs.length?`<div style="margin-top:10px;padding-left:8px;border-left:2px solid var(--line)">${subs.map(s=>`<div style="display:flex;align-items:center;gap:9px;padding:4px 0"><button onclick="completeTask(${s.id})" style="width:18px;height:18px;border-radius:5px;border:2px solid #3b5;background:${s.status==='done'?'#22c55e':'none'};cursor:pointer"></button><span style="font-size:13px;${s.status==='done'?'text-decoration:line-through;color:var(--t3)':''}">${esc(s.title)}</span></div>`).join('')}</div>`:''}
      ${(t.kind==='project'&&taskFilter==='open')?`<button onclick="addSubtask(${t.id})" class="btn-g" style="height:26px;font-size:10px;padding:0 10px;margin-top:6px">+ Unteraufgabe</button>`:''}
    </div>`);
    $('#tl').appendChild(node);
  });
};

function setTaskFilter(f){taskFilter=f;go('tasks');}

async function acceptSuggestion(id){
  await post('/api/tasks/'+id+'/accept',{});
  toast('Aufgabe angenommen ✓');
  go('tasks');
}

function rejectSuggestion(id,title){
  formSheet('Vorschlag ablehnen',
    `<div style="font-size:14px;font-weight:600;margin-bottom:12px">"${title}"</div>
     <label style="font-size:12px;color:var(--t2)">Warum lehnst du ab? (hilft Mantis zu lernen)</label>
     <textarea id="rr" rows="3" placeholder="z.B. zu trivial, falsches Thema, bereits bekannt…" style="width:100%;box-sizing:border-box;margin-top:6px"></textarea>`,
    async()=>{
      await post('/api/tasks/'+id+'/reject',{reason:$('#rr').value});
      closeSheet(); toast('Abgelehnt'); go('tasks');
    }, 'Ablehnen'
  );
}

async function showResult(id){
  const ts=await api('/api/tasks?status=done');
  const t=ts.find(x=>x.id===id)||{};
  if(!t.mantis_result)return;
  const mdHtml = typeof marked !== 'undefined'
    ? marked.parse(t.mantis_result)
    : `<pre style="white-space:pre-wrap">${esc(t.mantis_result)}</pre>`;
  sheet(`<div style="width:40px;height:4px;background:#222224;border-radius:99px;margin:0 auto 16px"></div>
    <div style="font-weight:700;margin-bottom:16px;font-size:16px">${esc(t.title)}</div>
    <div class="md-result" style="font-size:13px;line-height:1.7;color:var(--t2)">${mdHtml}</div>`);
}

function taskMenu(id,title,filter){
  const opts=[];
  if(filter!=='archived')opts.push(`<button class="btn-g" style="border:none;padding:13px;border-radius:12px;width:100%;text-align:left;cursor:pointer;margin-bottom:8px" onclick="closeSheet();setProgress(${id},'${esc(title)}')">📊 Fortschritt setzen</button>`);
  if(filter==='open')opts.push(`<button class="btn-g" style="border:none;padding:13px;border-radius:12px;width:100%;text-align:left;cursor:pointer;margin-bottom:8px" onclick="closeSheet();archiveTask(${id})">📦 Archivieren</button>`);
  opts.push(`<button class="btn-g" style="border:none;padding:13px;border-radius:12px;width:100%;text-align:left;cursor:pointer;color:#ef6b6b" onclick="closeSheet();deleteTask(${id},'${esc(title)}')">🗑 Löschen</button>`);
  sheet(`<div style="width:40px;height:4px;background:#222224;border-radius:99px;margin:0 auto 16px"></div><div style="font-weight:700;margin-bottom:14px">${esc(title)}</div>${opts.join('')}`);
}

VIEWS.calendar=async(root)=>{

      const card=document.createElement('div');
      card.className='card';
      card.style.cssText='padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center';
      const timeDiv=document.createElement('div');
      timeDiv.style.cssText='min-width:48px;text-align:center;font-size:12px;color:var(--y);font-weight:600';
      timeDiv.textContent=e.start&&e.start.includes(' ')?e.start.split(' ')[1]:'📅';
      const body=document.createElement('div');
      body.style.cssText='flex:1;min-width:0';
      const title=document.createElement('div');
      title.style.cssText='font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      title.textContent=e.title;
      body.appendChild(title);
      if(e.location){const loc=document.createElement('div');loc.style.cssText='font-size:12px;color:var(--t2)';loc.textContent='📍 '+e.location;body.appendChild(loc);}

      right.style.cssText='display:flex;gap:6px;align-items:center;flex-shrink:0';
      if(e.calendar){const chip=document.createElement('span');chip.className='chip';chip.textContent=e.calendar;right.appendChild(chip);}

      if(e.source==='mantis'&&e.uid){
        const editBtn=document.createElement('button');
        editBtn.className='btn';editBtn.style.cssText='padding:4px 8px;font-size:11px';editBtn.textContent='✏️';
        editBtn.onclick=()=>editEvent(e);
        const delBtn=document.createElement('button');
        delBtn.style.cssText='background:#dc2626;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer';delBtn.textContent='🗑';
        delBtn.onclick=()=>askDelEvent(e);
        right.appendChild(editBtn);right.appendChild(delBtn);
      }
      card.appendChild(timeDiv);card.appendChild(body);card.appendChild(right);
      cl.appendChild(card);
    });
  });
};

async function askDelEvent(e){
  if(!confirm('Termin "'+e.title+'" löschen?'))return;
  await api('/api/calendar/'+e.uid,{method:'DELETE'});
  toast('Gelöscht ✓');go('calendar');
}

function editEvent(e){
  // Datum für datetime-local formatieren
  const toLocal=s=>{if(!s)return '';const d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  const wrap=document.createElement('div');
  const f1=document.createElement('input');f1.placeholder='Titel';f1.value=e.title||'';
  const f2=document.createElement('input');f2.type='datetime-local';f2.value=toLocal(e.start_iso||e.start)||'';
  const f3=document.createElement('input');f3.type='datetime-local';f3.value=toLocal(e.end_iso||e.end)||'';
  const f4=document.createElement('input');f4.placeholder='Ort (optional)';f4.value=e.location||'';
  [f1,f2,f3,f4].forEach(f=>{f.style.cssText='display:block;width:100%;margin-bottom:10px;padding:8px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:14px';wrap.appendChild(f);});
  formSheet('Termin bearbeiten',wrap.innerHTML,async()=>{
    const inputs=document.querySelectorAll('#sheetBody input');
    await api('/api/calendar/'+e.uid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:inputs[0].value,start:inputs[1].value,end:inputs[2].value||null,location:inputs[3].value||null})});
    closeSheet();toast('Gespeichert ✓');go('calendar');
  });
}

// Ring-Chart helper: SVG donut mit Overflow-Farbe, Start oben (12 Uhr)
function ringChart(id,val,goal,color,overColor){
  const R=46,stroke=10,C=2*Math.PI*R;
  const pct=goal>0?val/goal:0;
  const over=pct>1;
  const fill=Math.min(pct,1);
  const overfill=over?pct-1:0;
  // transform="rotate(-90 56 56)" dreht Startpunkt auf 12 Uhr
  const rot='transform="rotate(-90 56 56)"';
  const base=`<circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--bd)" stroke-width="${stroke}"/>`;
  const arc=`<circle cx="56" cy="56" r="${R}" fill="none" stroke="${color}" stroke-width="${stroke}"
    stroke-dasharray="${fill*C} ${C}" stroke-linecap="round" ${rot} style="transition:stroke-dasharray .5s"/>`;
  const overArc=over?`<circle cx="56" cy="56" r="${R}" fill="none" stroke="${overColor}" stroke-width="${stroke-3}"
    stroke-dasharray="${Math.min(overfill,1)*C} ${C}" stroke-linecap="round" ${rot} style="transition:stroke-dasharray .5s" opacity=".9"/>` :'';
  return `<svg id="${id}" viewBox="0 0 112 112" width="112" height="112">${base}${arc}${overArc}</svg>`;
}

  const rings=[
    {key:'kcal', label:'Kalorien', unit:'kcal', val:Math.round(t.kcal||0), goal:GOALS.kcal, color:'#eab308', over:'#f97316'},
    {key:'protein', label:'Protein', unit:'g', val:Math.round(t.protein||0), goal:GOALS.protein, color:'#3b82f6', over:'#a855f7'},
    {key:'carbs', label:'Carbs', unit:'g', val:Math.round(t.carbs||0), goal:GOALS.carbs, color:'#22c55e', over:'#f97316'},
    {key:'fat', label:'Fett', unit:'g', val:Math.round(t.fat||0), goal:GOALS.fat, color:'#ec4899', over:'#f97316'},
  ];
  // TDEE-Info klein anzeigen
  const meta=GOALS.meta||{};
  const trendIcon={'on_track':'✅','too_slow':'📈','too_fast':'📉','insufficient_data':'⏳','not_enough_span':'⏳'};
  const trendLabel={'on_track':'auf Kurs','too_slow':'zu langsam','too_fast':'zu schnell','insufficient_data':'zu wenig Daten','not_enough_span':'noch < 2 Wochen'};
  const trendStr=meta.trend_status?(` · ${trendIcon[meta.trend_status]||''}${meta.actual_kg_per_week!=null?' '+meta.actual_kg_per_week+' kg/Woche':''}`):'';
  const adjStr=meta.trend_adjustment?` · Anpassung <b style="color:${meta.trend_adjustment>0?'#22c55e':'#f97316'}">${meta.trend_adjustment>0?'+':''}${meta.trend_adjustment} kcal</b>`:'';
  const tdeeInfo=meta.tdee?`<div style="text-align:center;font-size:11px;color:var(--t3);margin-bottom:10px">BMR ${meta.bmr} × ${meta.activity_factor}${meta.activity_bonus>0?' + ⚡'+meta.activity_bonus:''}${adjStr}${trendStr}</div>`:'';
  const ringHtml=rings.map(r=>`
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="position:relative">
        ${ringChart('ring_'+r.key,r.val,r.goal,r.color,r.over)}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
          <span style="font-size:15px;font-weight:700;color:var(--tx)">${r.val}</span>
          <span style="font-size:10px;color:var(--t3)">${r.unit}</span>
        </div>
      </div>
      <div style="font-size:11px;color:var(--t2);text-align:center">${r.label}<br><span style="color:var(--t3)">/ ${r.goal}${r.unit}</span></div>
    </div>`).join('');
  $('#nt').appendChild(el(`<div class="c" style="padding:16px">
    ${tdeeInfo}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center">${ringHtml}</div>
  </div>`));

  $('#nl').appendChild(el(`<div class="c" style="padding:14px"><b>Heute</b>${(d.meals||[]).length?d.meals.map(m=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)"><div><div style="font-size:14px">${esc(m.description)}</div><div style="font-size:11px;color:var(--t2)">${m.meal_type}${m.protein_g?' · '+Math.round(m.protein_g)+'g P':''}${m.carbs_g?' · '+Math.round(m.carbs_g)+'g C':''}${m.fat_g?' · '+Math.round(m.fat_g)+'g F':''}</div></div>${m.calories?`<span class="chip">${m.calories} kcal</span>`:''}</div>`).join(''):'<div style="color:var(--t3);font-size:13px;margin-top:8px">Heute noch nichts.</div>'}</div>`));
};

VIEWS.journal=async(root)=>{

      <div style="display:flex;gap:16px;font-size:13px">
        <span>Stimmung&nbsp;<b style="color:${moodCol[todayEntry.mood||3]}">${todayEntry.mood||'–'}/5</b></span>
        <span>Energie&nbsp;<b style="color:#f59e0b">${todayEntry.energy||'–'}/5</b></span>
      </div>
      ${todayEntry.content ? `<div style="margin-top:10px;font-size:13px;color:var(--t2);line-height:1.5">${esc(todayEntry.content).slice(0,120)}${todayEntry.content.length>120?'…':''}</div>` : ''}

    <div class="c" style="padding:20px;margin-bottom:12px;text-align:center;border:1px dashed var(--bd)">

    </div>

    <div class="c" style="padding:16px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--t2)">Stimmung & Energie — 3 Wochen</div>
      <div style="position:relative;height:110px"><canvas id="cMood"></canvas></div>
    </div>

    <div class="c" style="padding:16px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--t2)">Was dich beschäftigt — 90 Tage</div>
      <div id="jThemes" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">Lädt…</div>
    </div>

    <div style="font-size:13px;font-weight:600;color:var(--t3);margin-bottom:8px;padding-left:2px">Vergangene Einträge</div>
    <div id="jl"></div>`;

  lineChart('cMood', moodData.map(x=>x.date?.slice(5)), [
    {label:'Stimmung', data:moodData.map(x=>x.mood), color:'#22c55e'},

  ]);

  api('/api/journal/themes').then(themes=>{
    const box=$('#jThemes');
    if(!themes.length){box.innerHTML='<span style="color:var(--t3);font-size:13px">Noch nicht genug Journal-Einträge.</span>';return;}
    const max=Math.max(...themes.map(t=>t.count),1);
    const palette=['#f59e0b','#6366f1','#a78bfa','#22c55e','#f97316'];
    box.innerHTML=themes.map((t,i)=>{
      const size=11+Math.round((t.count/max)*16);
      return `<span style="font-size:${size}px;color:${palette[i%palette.length]};font-weight:${size>20?700:500}">${esc(t.word)}</span>`;
    }).join(' ');
  }).catch(()=>{});

  const filtered = history.filter(j => !hasToday || j.id !== todayEntry.id);
  $('#jl').innerHTML = filtered.length ? filtered.map(j => {
    let details = '';
    if (j.prompts_answers) {

        <span>${new Date(j.date+'T12:00:00').toLocaleDateString('de',{weekday:'short',day:'numeric',month:'short'})}</span>

      </div>
      ${details||'<div style="font-size:13px;color:var(--t3);margin-top:6px">–</div>'}
    </div>`;
  }).join('') : '<div style="padding:20px;text-align:center;color:var(--t3);font-size:13px">Noch keine früheren Einträge.</div>';
};

async function journalCheckin(){
  // Prompts laden (async, Spinner zeigen)
  const sheet = document.createElement('div');
  sheet.id = 'jsheet';
  sheet.style.cssText = 'position:fixed;inset:0;background:#060608;z-index:200;overflow-y:auto;padding:20px 16px 40px';
  sheet.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button onclick="document.getElementById('jsheet').remove()" style="background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer">←</button>
      <b style="font-size:17px">Abend-Check-in</b>
    </div>
    <div style="text-align:center;padding:40px 0;color:var(--t3)" id="jloading">
      <div style="font-size:24px;margin-bottom:8px">🤔</div>
      Mantis überlegt sich Fragen…
    </div>`;
  document.body.appendChild(sheet);

  const emo = ['','😞','😕','😐','🙂','😄'];
  const moodCol = ['','#ef4444','#f97316','#eab308','#22c55e','#10b981'];
  let selMood = 3, selEnergy = 3;

  let prompts;
  try { prompts = (await api('/api/journal/prompts')).prompts; }
  catch(e) { prompts = ['Wie war dein Tag?','Was hat dich beschäftigt?','Worauf bist du stolz?']; }

  const moodBtns = [1,2,3,4,5].map(v =>
    `<button onclick="selMood=${v};document.querySelectorAll('.mbtn').forEach((b,i)=>{b.style.background=i+1==${v}?'${moodCol[v]}':'transparent';b.style.transform=i+1==${v}?'scale(1.25)':'scale(1)'});this.style.background='${moodCol[v]}'" class="mbtn" style="font-size:26px;background:transparent;border:none;cursor:pointer;transition:all .15s">${emo[v]}</button>`
  ).join('');
  const energyBtns = [1,2,3,4,5].map(v =>
    `<button onclick="selEnergy=${v};document.querySelectorAll('.ebtn').forEach((b,i)=>{b.style.background=i+1==${v}?'#f59e0b22':'transparent';b.style.transform=i+1==${v}?'scale(1.25)':'scale(1)';b.style.color=i+1<=${v}?'#f59e0b':'var(--t3)'});" class="ebtn" style="font-size:20px;background:transparent;border:none;cursor:pointer;transition:all .15s;color:var(--t3)">⚡</button>`
  ).join('');

  const questionsHtml = prompts.map((q,i) => `
    <div style="margin-bottom:18px">
      <div style="font-size:13px;color:var(--y);margin-bottom:6px;font-weight:600">${esc(q)}</div>
      <textarea id="ja${i}" rows="2" placeholder="Deine Antwort…" style="width:100%;box-sizing:border-box;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:10px;font-size:13px;resize:vertical;font-family:inherit"></textarea>
    </div>`).join('');

  document.getElementById('jloading').outerHTML = `
    <div style="margin-bottom:20px">
      <div style="font-size:13px;color:var(--t2);font-weight:600;margin-bottom:12px">Wie war deine Stimmung?</div>
      <div style="display:flex;justify-content:space-around;padding:8px 0">${moodBtns}</div>
    </div>
    <div style="margin-bottom:24px">
      <div style="font-size:13px;color:var(--t2);font-weight:600;margin-bottom:12px">Energielevel?</div>
      <div style="display:flex;justify-content:space-around;padding:8px 0">${energyBtns}</div>
    </div>
    <div style="border-top:1px solid #111113;padding-top:20px;margin-bottom:4px">
      <div style="font-size:13px;color:var(--t2);font-weight:600;margin-bottom:16px">💬 Mantis fragt…</div>
      ${questionsHtml}
    </div>
    <div style="margin-bottom:24px">
      <div style="font-size:13px;color:var(--t2);font-weight:600;margin-bottom:6px">Freier Gedanke</div>
      <textarea id="jfree" rows="4" placeholder="Alles was dir noch durch den Kopf geht…" style="width:100%;box-sizing:border-box;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:10px;font-size:13px;resize:vertical;font-family:inherit"></textarea>
    </div>
    <button onclick="submitJournal(${prompts.length})" class="btn" style="width:100%;padding:14px;font-size:15px;font-weight:600">Speichern ✓</button>`;

  // Default-Highlight Mood=3
  const mBtns = document.querySelectorAll('.mbtn');
  mBtns[2].style.transform='scale(1.25)'; mBtns[2].style.background=moodCol[3];
  const eBtns = document.querySelectorAll('.ebtn');
  [0,1,2].forEach(i=>{eBtns[i].style.color='#f59e0b';});
}

async function submitJournal(nq){
  const answers = [];
  // Prompts aus den Labels lesen
  const labels = document.querySelectorAll('#jsheet [style*="a5b4fc"]');
  for(let i=0;i<nq;i++){
    const q = labels[i]?.textContent || '';
    const a = document.getElementById('ja'+i)?.value||'';
    answers.push({question:q, answer:a});
  }
  const free = document.getElementById('jfree')?.value||'';
  const btn = document.querySelector('#jsheet .btn');
  if(btn){btn.disabled=true;btn.textContent='Wird gespeichert…';}
  await post('/api/journal',{mood:selMood,energy:selEnergy,content:free,prompts_answers:answers.filter(x=>x.answer)});
  document.getElementById('jsheet')?.remove();
  toast('Journal gespeichert 📖');
  if(CUR==='journal') go(CUR);
}

VIEWS.memory=async(root)=>{

    </div>

    <div id="mem-kg" style="display:none"></div>
    <div id="mem-net" style="display:none">
      <div class="c" style="padding:8px;margin-bottom:12px"><div id="kgNetwork" style="height:380px"></div></div>
      <div class="c" style="padding:14px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:10px">Wer taucht am häufigsten auf?</div>
        <div id="kgHeatmap"></div>
      </div>
    </div>
    <div id="mem-tl" style="display:none">
      <div class="c" style="padding:14px"><div style="position:relative;height:220px"><canvas id="cMemTimeline"></canvas></div></div>
    </div>
    <div id="mem-meals" style="display:none">
      <div class="c" style="padding:14px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:10px">Letzte Mahlzeiten</div>
        <div id="mealsList" style="font-size:13px;color:var(--tx)">Lädt…</div>
      </div>
    </div>`;

  const col={fact:'#fde047',goal:'#4ade80',pattern:'#c084fc',preference:'#f472b6',correction:'#fb923c',context:'#67e8f9',identity:'#fbbf24'};
  const typeCol={person:'#c084fc',place:'#34d399',project:'#fde047',organization:'#f472b6',concept:'#fb923c',habit:'#4ade80',goal:'#fbbf24'};

  const [ms, kg] = await Promise.all([api('/api/memories'), api('/api/knowledge')]);

  // Tab-Titel aktualisieren
  root.querySelector('[data-tab="lzg"]').textContent=`🧠 Fakten (${ms.length})`;
  root.querySelector('[data-tab="kg"]').textContent=`🕸️ Graph (${(kg.entities||[]).length} / ${(kg.relations||[]).length})`;

  // LZG-Fakten
  $('#mem-lzg').innerHTML=ms.length?ms.map(m=>`
    <div class="c" style="padding:13px;margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span class="chip" style="color:${col[m.category]||'#888'}">${m.category}</span>
        <div style="display:flex;gap:10px;align-items:center">
          <span style="font-size:11px;color:var(--t2)">${Math.round(m.confidence*100)}%</span>
          <button onclick="askDelMemory(${m.id})" style="background:none;border:none;color:#ef6b6b;font-size:15px;cursor:pointer">✕</button>
        </div>
      </div>
      <div style="font-size:14px">${esc(m.content)}</div>
    </div>`).join(''):'<div class="c" style="padding:24px;text-align:center;color:var(--t3)">Noch keine Erinnerungen.</div>';

  // KG-Viewer – ohne verschachtelte Template-Literals
  const ents=kg.entities||[], rels=kg.relations||[];
  const relsBySubj={};
  rels.forEach(r=>{(relsBySubj[r.subject]=relsBySubj[r.subject]||[]).push(r);});

  if(!ents.length){
    $('#mem-kg').innerHTML='<div class="c" style="padding:24px;text-align:center;color:var(--t3)">Noch kein Wissens-Graph.</div>';
  } else {
    const kgEl=$('#mem-kg');
    kgEl.innerHTML='';
    ents.forEach(e=>{
      const card=document.createElement('div');
      card.className='card';
      card.style.cssText='padding:12px;margin-bottom:8px';

      // Header
      const hdr=document.createElement('div');
      hdr.style.cssText='display:flex;justify-content:space-between;align-items:center';
      const nameSpan=document.createElement('div');
      nameSpan.innerHTML=`<span style="font-weight:600;font-size:14px">${esc(e.name)}</span> `
        +`<span class="chip" style="color:${typeCol[e.type]||'#888'}">${e.type}</span>`;
      const delBtn=document.createElement('button');
      delBtn.textContent='✕'; delBtn.style.cssText='background:none;border:none;color:#ef6b6b;font-size:14px;cursor:pointer';
      delBtn.onclick=()=>askDelKgEntity(e.id);
      hdr.appendChild(nameSpan); hdr.appendChild(delBtn);
      card.appendChild(hdr);

      // Beschreibung
      if(e.description){
        const desc=document.createElement('div');
        desc.style.cssText='font-size:12px;color:var(--t2);margin-top:4px';
        desc.textContent=e.description;
        card.appendChild(desc);
      }

      // Relationen
      (relsBySubj[e.name]||[]).forEach(r=>{
        const row=document.createElement('div');
        row.style.cssText='font-size:12px;color:var(--y);margin-top:6px;display:flex;justify-content:space-between;align-items:center';
        const txt=document.createElement('span');
        txt.innerHTML='→ <b>'+r.predicate.replace(/_/g,' ')+'</b> → '+esc(r.object);
        const rDel=document.createElement('button');
        rDel.textContent='✕'; rDel.style.cssText='background:none;border:none;color:#444;font-size:12px;cursor:pointer';
        rDel.onclick=()=>askDelKgRelation(r.id);
        row.appendChild(txt); row.appendChild(rDel);
        card.appendChild(row);
      });

      kgEl.appendChild(card);
    });
  }

  // Daten für Netzwerk/Timeline-Tabs zwischenspeichern (lazy gerendert beim Tab-Wechsel)
  window.__memCache={ents,rels,ms,typeCol,col};
};

function renderKgNetwork(){
  const c=window.__memCache; if(!c) return;
  const box=$('#kgNetwork'); if(!box||box._rendered) return;
  if(!c.ents.length){box.innerHTML='<div style="padding:24px;text-align:center;color:var(--t3);font-size:13px">Noch kein Wissens-Graph.</div>';return;}
  const nodes=c.ents.map(e=>({id:e.id,label:e.name,title:e.type+(e.description?' · '+e.description:''),
    color:{background:c.typeCol[e.type]||'#666',border:'#13131c'},font:{color:'#e4e4f0',size:13}}));
  const nameToId={}; c.ents.forEach(e=>nameToId[e.name]=e.id);
  const edges=c.rels.filter(r=>nameToId[r.subject]!=null&&nameToId[r.object]!=null).map(r=>({
    from:nameToId[r.subject],to:nameToId[r.object],label:r.predicate.replace(/_/g,' '),
    font:{color:'#8080a8',size:9,strokeWidth:0},color:{color:'#2c2c3d'},arrows:'to',
  }));
  const network=new vis.Network(box,{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},{
    physics:{stabilization:true,barnesHut:{springLength:120}},
    interaction:{hover:true},
    nodes:{shape:'dot',size:16,borderWidth:2},
    edges:{smooth:{type:'continuous'},width:1.5},
  });
  network.on('click',p=>{if(p.nodes.length)askDelKgEntity(p.nodes[0]);});
  box._rendered=true;
}

let _tlDate=new Date().toISOString().slice(0,10);

async function _tlLoad(date){
  _tlDate=date;
  const tl=await api(`/api/timeline?date=${date}`).catch(()=>({hours:[],total:0,date}));
  const wrap=$('#tlBody');if(!wrap)return;
  // Live-Events aus Buffer für heute dazumischen
  const todayLive=date===new Date().toISOString().slice(0,10)?_actLog.slice(0,30):[];
  const liveHour=new Date().getHours().toString().padStart(2,'0');

  if(!tl.hours.length&&!todayLive.length){
    wrap.innerHTML='<div style="color:var(--t3);font-size:13px;text-align:center;padding:32px 0">Keine Aktivität für diesen Tag.</div>';
    return;
  }

  // Live-Events in tl.hours einbauen
  const hoursMap={};
  tl.hours.forEach(h=>{hoursMap[h.hour]=h.events;});
  if(todayLive.length){
    const liveEvts=todayLive.map(e=>({type:e.type,summary:e.text||'',created_at:new Date(e.ts*1000).toISOString()}));
    hoursMap[liveHour]=[...liveEvts,...(hoursMap[liveHour]||[])];
  }

  const sortedHours=Object.entries(hoursMap).sort((a,b)=>b[0].localeCompare(a[0]));
  wrap.innerHTML=sortedHours.map(([hour,evts])=>`
    <div style="margin-bottom:16px">
      <div style="font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
        color:var(--t3);margin-bottom:6px;display:flex;align-items:center;gap:8px">
        <span style="background:var(--s2);padding:2px 7px;border-radius:4px">${hour}:00</span>
        <span style="color:var(--t3)">${evts.length} Event${evts.length!==1?'s':''}</span>
      </div>
      <div style="padding-left:8px;border-left:2px solid var(--s2)">
        ${evts.map(_tlRow).join('')}
      </div>
    </div>`).join('');

  const cnt=$('#tlCount');
  if(cnt)cnt.textContent=`${tl.total+(todayLive.length?` +${todayLive.length} live`:'')} Events`;
}

function _trend(cur,prev){
  if(cur==null)return '<span style="color:var(--t3)">–</span>';
  if(prev==null||prev===0)return `<b>${cur}</b>`;
  const diff=((cur-prev)/prev*100);
  const arrow=diff>1?'↑':diff<-1?'↓':'→';
  const color=Math.abs(diff)<1?'var(--t3)':(diff>0?'#4ade80':'#fb7185');
  return `<b>${cur}</b> <span style="color:${color};font-size:10px">${arrow}${Math.abs(Math.round(diff))}%</span>`;
}

async function brainRenderGraph(){
  const g=$('#brainGraph');if(!g)return;
  g.innerHTML='<div id="brainNetCanvas" style="width:100%;height:100%"></div>';
  try{
    const data=await api('/api/brain/graph');
    const nodes=new vis.DataSet(data.nodes);
    const edges=new vis.DataSet(data.edges);
    const network=new vis.Network($('#brainNetCanvas'),{nodes,edges},{
      nodes:{shape:'dot',font:{color:'#ccc',size:11},borderWidth:0},
      edges:{color:{color:'rgba(255,255,255,0.15)'},width:1,smooth:{type:'continuous'}},
      physics:{stabilization:{iterations:100},barnesHut:{gravitationalConstant:-3000,springLength:120}},
      interaction:{hover:true},
      background:{color:'transparent'},
    });
    network.on('click',p=>{
      if(p.nodes.length){
        const id=p.nodes[0];
        if(_brainView==='graph'){
          _brainView='list';
          const list=$('#brainList');const gDiv=$('#brainGraph');
          if(list)list.style.display='block';
          if(gDiv)gDiv.style.display='none';
        }
        brainOpenNote(id);
      }
    });
  }catch(e){g.innerHTML='<div style="padding:20px;color:var(--t3);font-size:12px">Graph konnte nicht geladen werden.</div>';}
}

function urlB64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const base64=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function getPushSub(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return null;
  const reg=await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function initPushUI(){
  const box=$('#pushStatus'),btn=$('#pushBtn');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    box.textContent='Dieser Browser unterstützt keine Push-Benachrichtigungen.';btn.disabled=true;btn.textContent='Nicht verfügbar';return;
  }
  const sub=await getPushSub();
  if(sub){box.textContent='✓ Aktiv auf diesem Gerät.';btn.textContent='Deaktivieren';}
  else{box.textContent='Noch nicht aktiviert auf diesem Gerät.';btn.textContent='Aktivieren';}
}
async function togglePush(){
  const btn=$('#pushBtn');btn.disabled=true;
  try{
    const existing=await getPushSub();
    if(existing){
      await api('/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:existing.endpoint})});
      await existing.unsubscribe();
      toast('Push deaktiviert');
    }else{
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){toast('Berechtigung verweigert');btn.disabled=false;return;}
      const {key}=await api('/api/push/vapid-public-key');
      if(!key){toast('Kein VAPID-Key konfiguriert');btn.disabled=false;return;}
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(key)});
      const j=sub.toJSON();
      await api('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(j)});
      toast('Push aktiviert ✓');
    }
  }catch(e){toast('Fehler: '+e.message);}
  btn.disabled=false;initPushUI();
}

function setAssignee(who){
  window._taskAssignee = who;
  ['user','mantis','auto'].forEach(k=>{
    const btn=document.getElementById('assign'+k.charAt(0).toUpperCase()+k.slice(1));
    if(!btn)return;
    if(k===who){
      btn.style.border='2px solid '+(who==='mantis'?'#fcd34d':who==='auto'?'#f59e0b':'#22c55e');
      btn.style.background=who==='mantis'?'var(--s2)':who==='auto'?'rgba(245,158,11,.08)':'rgba(34,197,94,.08)';
      btn.style.color=who==='mantis'?'#fcd34d':who==='auto'?'#f59e0b':'#22c55e';
    } else {
      btn.style.border='1px solid var(--bd)';
      btn.style.background='transparent';
      btn.style.color='#555';
    }
  });
  document.getElementById('mantisnote').style.display=who==='mantis'?'block':'none';
}

async function submitTask(){
  const title=document.getElementById('tt')?.value?.trim();
  if(!title){document.getElementById('tt').style.borderColor='#ef4444';return;}
  const btn=document.querySelector('#tasksheet .btn');
  if(btn){btn.disabled=true;btn.textContent='Wird erstellt…';}
  const assignee=window._taskAssignee||'user';
  const payload={
    title,
    notes:document.getElementById('tn')?.value||'',
    kind:document.getElementById('tk')?.value||'task',
    priority:document.getElementById('tp')?.value||'medium',
    due:document.getElementById('td')?.value||'',
    assigned_to: assignee==='auto'?undefined:assignee,
  };
  await post('/api/tasks',payload);
  document.getElementById('tasksheet')?.remove();
  toast(assignee==='mantis'?'Mantis übernimmt 🤖':'Aufgabe erstellt ✓');
  if(CUR==='tasks'||CUR==='home')go(CUR);
}

}

// ── Pull-to-Refresh ──────────────────────────────────────────────────────────
(function(){
  let startY=0, pulling=false, indicator=null;
  const THRESHOLD=70;
  function getIndicator(){
    if(!indicator){
      indicator=document.createElement('div');
      indicator.id='ptr-indicator';
      indicator.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-40px);background:var(--ac);color:#fff;padding:6px 16px;border-radius:0 0 12px 12px;font-size:12px;font-weight:700;z-index:9999;transition:transform .2s;pointer-events:none;';
      indicator.textContent='↓ Aktualisieren';
      document.body.appendChild(indicator);
    }
    return indicator;
  }
  document.addEventListener('touchstart',e=>{
    if(window.scrollY===0 && e.touches.length===1){
      startY=e.touches[0].clientY; pulling=true;
    }
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling)return;
    const dy=e.touches[0].clientY-startY;
    if(dy>20){
      const pct=Math.min(dy/THRESHOLD,1);
      getIndicator().style.transform=`translateX(-50%) translateY(${-40+pct*48}px)`;
      getIndicator().textContent=pct>=1?'↑ Loslassen…':'↓ Aktualisieren';
    }
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!pulling)return;
    pulling=false;
    const dy=e.changedTouches[0].clientY-startY;
    const ind=getIndicator();
    ind.style.transform='translateX(-50%) translateY(-40px)';
    if(dy>=THRESHOLD){
      ind.textContent='⟳ Lädt…';
      ind.style.transform='translateX(-50%) translateY(8px)';
      setTimeout(()=>{go(CUR||'home');ind.style.transform='translateX(-50%) translateY(-40px)';},800);
    }
  },{passive:true});
})();
